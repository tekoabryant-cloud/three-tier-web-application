<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Application</title>
</head>
<body>

    <h1>Cloud Application</h1>

    <p>Submit an application below.</p>

    <form id="applicationForm">

        <label for="name">Name:</label>
        <input type="text" id="name" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" required>

        <br><br>

        <button type="submit">Submit Application</button>

    </form>

    <p id="message"></p>

    <script>
        document.getElementById("applicationForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;

            const response = await fetch("http://127.0.0.1:5000/api/applications", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    email: email
                })
            });

            const result = await response.json();

            document.getElementById("message").textContent = result.message || result.error;
        });
    </script>

</body>
</html>
